schema_version: deskpilot.workspace-coding-golden-suite.v1
suite_id: deskpilot.workspace-coding-public-api
version: 1
cases:
  - case_id: python.public-api.restart-delivery
    ecosystem: python
    goal: 检查计算模块并提出一个由固定测试保护的最小修改
    test_path: tests/test_sample.py
    restart_checkpoints: [patch_approval, git_approval]
    max_advances: 40
    files:
      - path: src/calculator.py
        content: |
          def add(left: int, right: int) -> int:
              return left + right
      - path: src/constants.py
        content: |
          DEFAULT_LIMIT = 10
      - path: tests/test_sample.py
        content: |
          from calculator import add
          from constants import DEFAULT_LIMIT

          def test_calculator_contract() -> None:
              assert add(2, 3) == 5
              assert DEFAULT_LIMIT == 10
    expect:
      candidate_paths: [src/calculator.py, src/constants.py]
      changed_paths: [src/calculator.py, src/constants.py]
      final_stage: delivered
      push_disabled: true
      rollback_backups_retained: true
  - case_id: node.public-api.full-delivery
    ecosystem: node
    goal: 检查计数模块并提出一个由固定测试保护的最小修改
    test_path: tests/sample.test.js
    restart_checkpoints: []
    max_advances: 40
    files:
      - path: src/counter.ts
        content: |
          export const increment = (value: number) => value + 1
      - path: src/limit.ts
        content: |
          export const defaultLimit = 10
      - path: tests/sample.test.js
        content: |
          import test from 'node:test'
          import assert from 'node:assert/strict'

          test('recorded node contract', () => {
            assert.equal(2 + 3, 5)
          })
    expect:
      candidate_paths: [src/counter.ts, src/limit.ts]
      changed_paths: [src/counter.ts, src/limit.ts]
      final_stage: delivered
      push_disabled: true
      rollback_backups_retained: true
