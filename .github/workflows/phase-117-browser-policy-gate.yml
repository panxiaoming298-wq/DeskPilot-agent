name: Phase 117A Browser control plane offline gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  browser-policy-offline:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12.13"
          working-directory: backend
          enable-cache: true
      - name: Install frozen Python dependencies
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --all-extras
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv\Scripts\python.exe
      - name: Validate frozen Browser policy manifest
        run: |
          $manifest = uv run python -m deskpilot.phase117_browser_gate manifest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($manifest.policy_digest -ne "2aeb30b31161f41ba48841c86d6f80f7847327f58d31cfd500b2ed936633177f") { throw "Browser policy digest drifted" }
          if ($manifest.browser_product -ne "microsoft_edge" -or $manifest.profile_name -ne "DeskPilot") { throw "Dedicated Edge profile drifted" }
          if (@($manifest.default_allowed_origins).Count -ne 0) { throw "Browser default allowlist is not empty" }
          if (@($manifest.actions).Count -ne 8) { throw "Browser action matrix drifted" }
          if (@($manifest.actions | Where-Object { $_.requires_fresh_approval }).Count -ne 4) { throw "Consequential Browser approval matrix drifted" }
          if (@($manifest.offline_execution_boundary.PSObject.Properties.Value | Where-Object { $_ -eq $true }).Count -ne 0) { throw "Offline Browser boundary enabled an effect" }
      - name: Run Browser policy and control-plane tests
        run: |
          uv run pytest tests/test_phase117_browser_policy.py tests/test_browser_control_plane.py tests/test_migrations.py::test_browser_control_plane_migration_round_trip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run mypy
      - name: Verify wheel contains the immutable Browser policy
        run: |
          uv build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -c "from pathlib import Path; import zipfile; wheel=max(Path('dist').glob('*.whl'), key=lambda p:p.stat().st_mtime_ns); names=set(zipfile.ZipFile(wheel).namelist()); expected='deskpilot/evaluations/phase117_browser_automation_policy_v1.yaml'; assert expected in names, expected; print(expected)"
      - name: Verify immutable baselines and whitespace are untouched
        working-directory: .
        run: |
          git diff --exit-code -- backend/tests/baselines/evaluations
          git diff --check
