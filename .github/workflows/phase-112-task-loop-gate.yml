name: Phase 112 persistent task loop gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend-task-loop-gate:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12.13"
          working-directory: backend
          enable-cache: true
      - name: Install frozen Python dependencies
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --all-extras
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv\Scripts\python.exe
      - name: Run static checks
        run: |
          uv run ruff check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run mypy
      - name: Verify migration lineage and SQLite integrity
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          $head = uv run python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; script=ScriptDirectory.from_config(Config('alembic.ini')); heads=script.get_heads(); assert len(heads)==1, heads; lineage={item.revision for item in script.iterate_revisions(heads[0], 'base', inclusive=True)}; assert '0053_task_loop_execution' in lineage, lineage; print(heads[0])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = ($head | Select-Object -Last 1).Trim()
          uv run alembic upgrade head
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run alembic current
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run alembic check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -c "import sqlite3,sys; con=sqlite3.connect('file:data/deskpilot.db?mode=ro', uri=True); assert con.execute('PRAGMA integrity_check').fetchone()==('ok',); assert not con.execute('PRAGMA foreign_key_check').fetchall(); assert con.execute('SELECT version_num FROM alembic_version').fetchone()==(sys.argv[1],); con.close()" $head
      - name: Run Phase 112 focused tests
        run: |
          uv run pytest `
            tests/test_task_loop_domain.py `
            tests/test_multi_step_plan_runtime.py `
            tests/test_task_loop_activation_runtime.py `
            tests/test_capability_executor_registry.py `
            tests/test_capability_input_binding_catalog.py `
            tests/test_builtin_capability_executors.py `
            tests/test_capability_execution_runtime.py `
            tests/test_agent_verified_result_bridge.py `
            tests/test_task_loop_agent_runtime.py `
            tests/test_task_loop_reducer.py `
            tests/test_phase111_turn_planner_workbench.py
      - name: Compare immutable evaluation baselines
        run: |
          $before = @(Get-ChildItem tests\baselines\evaluations -File | Sort-Object Name | ForEach-Object { "{0}|{1}" -f $_.Name,(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash })
          uv run python -m deskpilot.evaluation_gate compare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -m deskpilot.phase75_gate compare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $after = @(Get-ChildItem tests\baselines\evaluations -File | Sort-Object Name | ForEach-Object { "{0}|{1}" -f $_.Name,(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash })
          if (@(Compare-Object $before $after).Count -ne 0) { throw "Evaluation compare rewrote immutable baselines" }
          git diff --exit-code -- tests/baselines/evaluations
      - name: Build wheel and verify Agent Prompt resources
        run: |
          uv build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -c "from pathlib import Path; import zipfile; source=Path('src/deskpilot/agents/prompts'); expected={f'deskpilot/agents/prompts/{p.name}' for p in source.iterdir() if p.is_file() and p.suffix in {'.json','.txt'}}; wheel=max(Path('dist').glob('*.whl'), key=lambda p:p.stat().st_mtime_ns); missing=expected-set(zipfile.ZipFile(wheel).namelist()); assert not missing, sorted(missing); print(f'verified {len(expected)} prompt resources')"
      - name: Run default backend suite
        run: |
          uv run pytest --junitxml=pytest-default.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -c "from xml.etree import ElementTree as E; root=E.parse('pytest-default.xml').getroot(); cases=[x for x in root.iter() if x.tag.rsplit('}',1)[-1]=='testcase']; skipped=[x for x in cases if any(c.tag.rsplit('}',1)[-1]=='skipped' for c in x)]; assert len(cases)==741,len(cases); assert len(skipped)==12,len(skipped); print('verified 729 passed and 12 external skips')"
      - name: Verify whitespace
        working-directory: .
        run: git diff --check

  frontend-task-loop-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false
      - name: Install frozen frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend gate
        run: |
          $report = Join-Path $env:RUNNER_TEMP "deskpilot-phase112-vitest.json"
          pnpm exec vitest run --reporter=json --outputFile=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (@($result.testResults).Count -ne 22 -or [int]$result.numTotalTests -ne 157 -or [int]$result.numFailedTests -ne 0) { throw "Phase 112 frontend test count failed" }
          pnpm type-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
