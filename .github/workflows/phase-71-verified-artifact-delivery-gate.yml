name: Phase 71 verified artifact delivery gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verified-artifact-delivery-gate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Verified artifact delivery acceptance tests
        run: |
          uv run pytest tests/test_verified_artifact_delivery.py tests/test_agent_research_runtime.py tests/test_task_plans.py tests/test_migrations.py::test_stage_71_verified_artifact_delivery_migration_round_trips
      - name: Static checks
        run: |
          uv run ruff check src tests
          uv run mypy
      - name: Frozen evaluation baseline
        run: uv run python -m deskpilot.evaluation_gate compare
      - name: Verify migration head and locked environment
        run: |
          uv lock --check
          uv run alembic upgrade head
          uv run alembic check
