name: Phase 73 long-term memory gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  long-term-memory-backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Long-term memory acceptance tests
        run: |
          uv run pytest tests/test_long_term_memory.py tests/test_context_working_memory.py tests/test_migrations.py::test_stage_73_long_term_memory_migration_round_trips
      - name: Static checks
        run: |
          uv run ruff check src tests
          uv run mypy
      - name: Verify migration head and locked environment
        run: |
          uv lock --check
          uv run alembic upgrade head
          uv run alembic check

  long-term-memory-frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- MemoryControlCenter.spec.ts
      - run: pnpm type-check
      - run: pnpm build
