name: Phase 69 Task Contract and Plan Compiler gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  plan-compiler-gate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Task Contract and Plan Compiler acceptance tests
        run: |
          uv run pytest tests/test_task_plans.py tests/test_migrations.py::test_stage_69_task_contract_plan_migration_round_trips
      - name: Static checks
        run: |
          uv run ruff check src tests/test_task_plans.py tests/test_migrations.py
          uv run mypy
      - name: Verify migration head and locked environment
        run: |
          uv lock --check
          uv run alembic upgrade head
          uv run alembic check
