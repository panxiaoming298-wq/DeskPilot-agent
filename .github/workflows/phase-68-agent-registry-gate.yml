name: Phase 68 Agent Registry gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  agent-registry-gate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Agent Contract and Registry acceptance tests
        run: uv run pytest tests/test_agent_registry.py
      - name: Static checks
        run: |
          uv run ruff check src tests/test_agent_registry.py
          uv run mypy
      - name: Verify packaged Prompt resources
        run: |
          uv build --wheel
          uv run python -c "import glob,zipfile; names=set(zipfile.ZipFile(glob.glob('dist/*.whl')[-1]).namelist()); wanted={'deskpilot/agents/prompts/computer_observer.json','deskpilot/agents/prompts/computer_observer.txt','deskpilot/agents/prompts/knowledge_researcher.json','deskpilot/agents/prompts/task_synthesizer.json'}; assert wanted <= names"
