name: Phase 75 multi-agent release gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  multi-agent-release-gate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Run phase 75 adversarial and production-path evidence
        run: |
          uv run pytest tests/test_phase75_evaluation_gate.py tests/test_agent_registry.py tests/test_task_plans.py tests/test_verified_artifact_delivery.py tests/test_agent_research_runtime.py tests/test_context_working_memory.py tests/test_long_term_memory.py
      - name: Compare immutable evaluation baselines
        run: |
          uv run python -m deskpilot.evaluation_gate compare
          uv run python -m deskpilot.phase75_gate compare
          git diff --exit-code -- tests/baselines/evaluations
      - name: Static and migration checks
        run: |
          uv run ruff check src tests
          uv run mypy
          uv run alembic upgrade head
          uv run alembic check
          uv lock --check
